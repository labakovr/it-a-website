name: Update equipment catalog

on:
  schedule:
    # Every Monday at 03:00 UTC (06:00 Europe/Minsk)
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scrape ipmatika.by catalog
        shell: pwsh
        run: pwsh -File catalog/scripts/scrape.ps1

      - name: Generate catalog pages
        shell: pwsh
        run: pwsh -File catalog/scripts/generate.ps1

      - name: Commit and push if changed
        run: |
          git config user.name "it-a-catalog-bot"
          git config user.email "ai@it-a.by"
          git add catalog/ assets/img/catalog/ sitemap-catalog.xml
          # catalog/data/catalog.json always changes (it carries a fresh
          # generatedAt timestamp), so ignore it when deciding whether
          # anything *real* changed — avoids a no-op commit every week.
          if git diff --cached --quiet -- . ':(exclude)catalog/data/catalog.json'; then
            echo "No catalog changes."
          else
            git commit -m "Auto-update equipment catalog from ipmatika.by

Scheduled weekly sync: re-scraped the 4 mirrored categories
(IP-телефоны, IP-АТС, VoIP-шлюзы, Гарнитуры) from ipmatika.by and
regenerated the static catalog pages and sitemap-catalog.xml.

Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>"
            git push
          fi
