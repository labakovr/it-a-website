<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Интеграция телефонии с Битрикс24">
  <rect width="1280" height="720" fill="#1d1d1b"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8fbf21"/>
  <text x="90" y="150" fill="#8fbf21" font-family="Nunito, 'Segoe UI', sans-serif" font-size="26" font-weight="800" letter-spacing="3">СТАТЬЯ · ТЕЛЕФОНИЯ</text>
  <text x="90" y="228" fill="#ececec" font-family="Nunito, 'Segoe UI', sans-serif" font-size="60" font-weight="900">Телефония и Битрикс24</text>
  <text x="92" y="296" fill="#b7b7b2" font-family="Nunito, 'Segoe UI', sans-serif" font-size="27" font-weight="700">Виртуальная АТС или своя станция</text>

  <g transform="translate(90 350)" font-family="Nunito, 'Segoe UI', sans-serif">
    <rect x="0" y="0" width="530" height="288" rx="16" fill="#262622"/>
    <text x="28" y="42" fill="#8fbf21" font-size="17" font-weight="800">Виртуальная АТС оператора</text>
    <text x="28" y="66" fill="#7f8074" font-size="12.5" font-weight="700">МТС Беларусь, А1 — приложение из Маркета</text>
    <g font-size="13" font-weight="700" fill="#d7d7d3">
      <circle cx="34" cy="98" r="4" fill="#8fbf21"/><text x="48" y="103">Не нужно своё оборудование</text>
      <circle cx="34" cy="128" r="4" fill="#8fbf21"/><text x="48" y="133">Номера и лицензия уже у оператора</text>
      <circle cx="34" cy="158" r="4" fill="#8fbf21"/><text x="48" y="163">Заметно проще запустить</text>
    </g>
    <rect x="28" y="192" width="474" height="66" rx="10" fill="#303029"/>
    <text x="44" y="216" fill="#ececec" font-size="12.5" font-weight="800">Всё равно требует настройки</text>
    <text x="44" y="238" fill="#9a9a92" font-size="11.5" font-weight="700">сценарии звонков, права доступа, поддержка приложения</text>

    <rect x="570" y="0" width="530" height="288" rx="16" fill="#262622"/>
    <text x="598" y="42" fill="#d9b23a" font-size="17" font-weight="800">Собственная станция</text>
    <text x="598" y="66" fill="#7f8074" font-size="12.5" font-weight="700">Asterisk и станции Yeastar</text>
    <g font-size="13" font-weight="700" fill="#d7d7d3">
      <circle cx="604" cy="98" r="4" fill="#d9b23a"/><text x="618" y="103">Полный контроль над телефонией</text>
      <circle cx="604" cy="128" r="4" fill="#d9b23a"/><text x="618" y="133">Свои линии, шлюзы, маршрутизация</text>
      <circle cx="604" cy="158" r="4" fill="#d9b23a"/><text x="618" y="163">Нужен отдельный модуль интеграции</text>
    </g>
    <rect x="598" y="192" width="474" height="66" rx="10" fill="#303029"/>
    <text x="614" y="216" fill="#ececec" font-size="12.5" font-weight="800">Больше ответственности</text>
    <text x="614" y="238" fill="#9a9a92" font-size="11.5" font-weight="700">сервер, обновления и поддержка станции — на стороне компании</text>
  </g>
</svg>
