<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Миграция в Битрикс24: перенос данных из amoCRM и других CRM">
  <rect width="1280" height="720" fill="#1d1d1b"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8fbf21"/>
  <text x="90" y="150" fill="#8fbf21" font-family="Nunito, 'Segoe UI', sans-serif" font-size="26" font-weight="800" letter-spacing="3">СТАТЬЯ · CRM</text>
  <text x="90" y="240" fill="#ececec" font-family="Nunito, 'Segoe UI', sans-serif" font-size="66" font-weight="900">Миграция в Битрикс24</text>
  <text x="92" y="308" fill="#b7b7b2" font-family="Nunito, 'Segoe UI', sans-serif" font-size="27" font-weight="700">amoCRM и другие системы — без иллюзии «перенесётся всё»</text>

  <g transform="translate(90 360)" font-family="Nunito, 'Segoe UI', sans-serif">
    <rect x="0" y="0" width="530" height="288" rx="16" fill="#262622"/>
    <text x="28" y="42" fill="#8fbf21" font-size="17" font-weight="800">Штатный перенос</text>
    <text x="28" y="66" fill="#7f8074" font-size="12.5" font-weight="700">приложение из Маркета или импорт CSV</text>
    <g font-size="13" font-weight="700" fill="#d7d7d3">
      <circle cx="34" cy="98" r="4" fill="#8fbf21"/><text x="48" y="103">Быстро и часто бесплатно</text>
      <circle cx="34" cy="128" r="4" fill="#8fbf21"/><text x="48" y="133">Без программирования</text>
      <circle cx="34" cy="158" r="4" fill="#8fbf21"/><text x="48" y="163">Подходит для типовой базы</text>
    </g>
    <rect x="28" y="192" width="474" height="66" rx="10" fill="#303029"/>
    <text x="44" y="216" fill="#ececec" font-size="12.5" font-weight="800">Поля и воронки сопоставляются вручную</text>
    <text x="44" y="238" fill="#9a9a92" font-size="11.5" font-weight="700">то, чему нет аналога в Битрикс24 — не переносится</text>

    <rect x="570" y="0" width="530" height="288" rx="16" fill="#262622"/>
    <text x="598" y="42" fill="#d9b23a" font-size="17" font-weight="800">Миграция через API</text>
    <text x="598" y="66" fill="#7f8074" font-size="12.5" font-weight="700">для больших и нестандартных баз</text>
    <g font-size="13" font-weight="700" fill="#d7d7d3">
      <circle cx="604" cy="98" r="4" fill="#d9b23a"/><text x="618" y="103">Нестандартные поля и вложения</text>
      <circle cx="604" cy="128" r="4" fill="#d9b23a"/><text x="618" y="133">История звонков и переписки</text>
      <circle cx="604" cy="158" r="4" fill="#d9b23a"/><text x="618" y="163">Тестовый перенос и сверка данных</text>
    </g>
    <rect x="598" y="192" width="474" height="66" rx="10" fill="#303029"/>
    <text x="614" y="216" fill="#ececec" font-size="12.5" font-weight="800">Отдельный проект интегратора</text>
    <text x="614" y="238" fill="#9a9a92" font-size="11.5" font-weight="700">дороже и дольше, но минимизирует потери данных</text>
  </g>
</svg>
