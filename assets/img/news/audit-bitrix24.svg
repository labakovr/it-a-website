<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Аудит работы в Битрикс24">
  <rect width="1280" height="720" fill="#1d1d1b"/>
  <rect x="0" y="0" width="1280" height="6" fill="#8fbf21"/>
  <text x="90" y="150" fill="#8fbf21" font-family="Nunito, 'Segoe UI', sans-serif" font-size="26" font-weight="800" letter-spacing="3">СТАТЬЯ · АУДИТ</text>
  <text x="90" y="240" fill="#ececec" font-family="Nunito, 'Segoe UI', sans-serif" font-size="72" font-weight="900">Аудит работы</text>
  <text x="90" y="316" fill="#ececec" font-family="Nunito, 'Segoe UI', sans-serif" font-size="72" font-weight="900">в Битрикс24</text>
  <text x="92" y="374" fill="#b7b7b2" font-family="Nunito, 'Segoe UI', sans-serif" font-size="27" font-weight="700">Что реально используется, а что нет</text>

  <g transform="translate(90 424)" font-family="Nunito, 'Segoe UI', sans-serif">
    <rect x="0" y="0" width="1100" height="224" rx="16" fill="#262622"/>

    <circle cx="150" cy="112" r="70" fill="none" stroke="#4c952e" stroke-width="10"/>
    <path d="M150 112 m0 -70 a70 70 0 0 1 60 105" fill="none" stroke="#8fbf21" stroke-width="10" stroke-linecap="round"/>
    <text x="150" y="120" fill="#ececec" font-size="30" font-weight="900" text-anchor="middle">72%</text>
    <text x="150" y="204" fill="#b7b7b2" font-size="15" font-weight="700" text-anchor="middle">используется</text>

    <g transform="translate(330 40)">
      <rect x="0" y="0" width="290" height="34" rx="6" fill="#8fbf21"/>
      <text x="14" y="23" fill="#1d1d1b" font-size="15" font-weight="800">Воронка «Продажи» — активна</text>

      <rect x="0" y="50" width="220" height="34" rx="6" fill="#303029"/>
      <text x="14" y="73" fill="#7f8074" font-size="15" font-weight="700">Воронка «Партнёры» — заброшена</text>

      <rect x="0" y="100" width="260" height="34" rx="6" fill="#8fbf21"/>
      <text x="14" y="123" fill="#1d1d1b" font-size="15" font-weight="800">Интеграция с сайтом — работает</text>

      <rect x="0" y="150" width="240" height="34" rx="6" fill="#303029"/>
      <text x="14" y="173" fill="#7f8074" font-size="15" font-weight="700">12 полей карточки — пустые</text>
    </g>

    <g stroke="#7f8074" stroke-width="2" stroke-dasharray="6 6">
      <line x1="700" y1="30" x2="1040" y2="30"/>
      <line x1="700" y1="80" x2="1040" y2="80"/>
      <line x1="700" y1="130" x2="1040" y2="130"/>
      <line x1="700" y1="180" x2="1040" y2="180"/>
    </g>
    <text x="700" y="12" fill="#8fbf21" font-size="15" font-weight="800">Отчёт и рекомендации</text>
    <circle cx="1040" cy="30" r="6" fill="#8fbf21"/>
    <circle cx="1040" cy="80" r="6" fill="#4c952e"/>
    <circle cx="1040" cy="130" r="6" fill="#8fbf21"/>
    <circle cx="1040" cy="180" r="6" fill="#4c952e"/>
  </g>
</svg>
